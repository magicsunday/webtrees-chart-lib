name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - run: npm ci
            # Single source of truth: the workflow runs exactly the local `ci:test`
            # gate (biome ci + typecheck + cpd + jest), so GitHub CI can never be
            # less strict than a local check.
            - run: npm run ci:test
            - run: npm run build
